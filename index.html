<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

/* ---------- Supabase ---------- */
const CONFIGURED = window.SUPABASE_URL && !window.SUPABASE_URL.includes("TU-PROYECTO") && window.SUPABASE_ANON_KEY && !window.SUPABASE_ANON_KEY.includes("PEGA-AQUI");
const sb = CONFIGURED ? supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY) : null;

/* ---------- constantes / formato ---------- */
const CURRENCIES = ["USD","ARS","UYU"];
const CUR_LABEL = {USD:"Dólares",ARS:"Pesos AR",UYU:"Pesos UY"};
const CUR_SYM = {USD:"US$",ARS:"AR$",UYU:"$U"};
const EST_STYLE = {
  Cobrado:{bg:"var(--ok-bg)",fg:"var(--ok)"}, Pendiente:{bg:"var(--warn-bg)",fg:"var(--warn)"},
  Perdido:{bg:"var(--bad-bg)",fg:"var(--bad)"}, Anulado:{bg:"var(--muted-bg)",fg:"var(--muted-fg)"}, Neteado:{bg:"var(--muted-bg)",fg:"var(--muted-fg)"},
};
const fmtMoney=(n,c)=>{const v=Number(n||0);return `${v<0?"-":""}${CUR_SYM[c]||""} ${Math.abs(v).toLocaleString("es-UY",{minimumFractionDigits:2,maximumFractionDigits:2})}`;};
const monthKey=iso=>iso?String(iso).slice(0,7):"";
const M_ES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const monthLabel=mk=>{if(!mk)return "—";const[y,m]=mk.split("-");return `${M_ES[+m-1]} ${y.slice(2)}`;};
const todayISO=()=>new Date().toISOString().slice(0,10);
const usdOf=i=>(i.total_usd==null?0:Number(i.total_usd));
const hasUsd=i=>i.total_usd!=null;
const fmtUSD=v=>fmtMoney(v,"USD");

/* ---------- normalización + parse del Excel ---------- */
const _num=v=>{const n=Number(v);return isNaN(n)?0:Math.round(n*100)/100;};
const _str=v=>v==null?"":String(v).trim();
function _toISO(v){
  if(v==null||v==="")return null;
  if(v instanceof Date)return new Date(v.getTime()-v.getTimezoneOffset()*60000).toISOString().slice(0,10);
  if(typeof v==="number"){const d=new Date(Math.round((v-25569)*86400*1000));return d.toISOString().slice(0,10);}
  const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);if(m){let[,d,mo,y]=m;if(y.length===2)y="20"+y;return `${y}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}`;}
  return null;
}
const _serv=s=>{s=_str(s).toLowerCase();if(!s)return "Otro";if(s.includes("shop"))return "TuShopper";if(s.includes("fud"))return "TuFud";if(s.includes("deri"))return "Deri";if(s.includes("scrap"))return "Scrapper";return s.charAt(0).toUpperCase()+s.slice(1);};
const _mon=s=>{s=_str(s).toUpperCase();if(s.includes("DOLAR"))return "USD";if(s.includes("ARGENT"))return "ARS";if(s.includes("URUGUAY"))return "UYU";return CURRENCIES.includes(s)?s:"USD";};
const _est=s=>{s=_str(s).toUpperCase();if(s==="PAGO")return "Cobrado";if(s.includes("PENDIENTE"))return "Pendiente";if(s.includes("PERDID")||s.includes("INCOBRAB"))return "Perdido";if(s.includes("NETE")||s.includes("CANCEL"))return "Neteado";if(s.includes("ANULAD"))return "Perdido";return "Pendiente";};
const _medio=s=>{const m={santander:"Santander",itau:"Itau",blex:"Blex",dlocal:"Dlocal",cheque:"Cheque",koywe:"Koywe",anulada:""};const l=_str(s).toLowerCase();return l?(m[l]||_str(s).charAt(0).toUpperCase()+_str(s).slice(1)):"";};
const clave=i=>`${_str(i.cliente).toLowerCase()}|${_str(i.numeracion).toLowerCase()}|${i.mes||""}|${i.total}|${i.moneda}`;

function parseWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array",cellDates:true});
  const name=wb.SheetNames.find(n=>/omnilog/i.test(n))||wb.SheetNames.find(n=>/factur/i.test(n));
  if(!name)throw new Error("No encontré una hoja FACTURACION_OMNILOG en el archivo.");
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
  const out=[];
  for(let r=1;r<rows.length;r++){
    const row=rows[r];if(!row)continue;const cli=row[0];if(!cli||!String(cli).trim())continue;
    let com=_str(row[23]);if(com.toLowerCase()==="s/c")com="";com=com.slice(0,90);
    const o={cliente:_str(cli),comprobante:_str(row[1]),numeracion:_str(row[2]),servicio:_serv(row[3]),moneda:_mon(row[4]),
      importe:_num(row[5]),iva:_num(row[6]),total:_num(row[7]),fecha_emision:_toISO(row[11]),mes:_toISO(row[12]),
      fecha_vencimiento:_toISO(row[14]),estado:_est(row[15]),medio_pago:_medio(row[16]),fecha_pago:_toISO(row[20]),
      referencia:_str(row[21]).slice(0,40),comentarios:com};
    const tcv=(typeof row[8]==="number"&&row[8]>0)?row[8]:null;
    const colUsd=(typeof row[9]==="number"&&row[9]>0)?Math.round(row[9]*100)/100:null;
    o.tc=tcv;
    o.total_usd = o.moneda==="USD" ? o.total : (colUsd!=null ? colUsd : (tcv ? Math.round(o.total/tcv*100)/100 : null));
    o.clave=clave(o);out.push(o);
  }
  if(!out.length)throw new Error("La hoja no tiene filas con cliente.");
  return out;
}

/* ---------- acceso a datos ---------- */
async function fetchAll(){
  let all=[],from=0;
  while(true){
    const {data,error}=await sb.from("facturas").select("*").order("mes",{ascending:false}).range(from,from+999);
    if(error)throw error;all=all.concat(data);if(data.length<1000)break;from+=1000;
  }
  return all;
}
async function fetchClaves(){
  let all=[],from=0;
  const cols="id,clave,estado,servicio,comprobante,importe,iva,fecha_emision,fecha_vencimiento,comentarios,referencia,total_usd,tc";
  while(true){
    const {data,error}=await sb.from("facturas").select(cols).range(from,from+999);
    if(error)throw error;all=all.concat(data);if(data.length<1000)break;from+=1000;
  }
  return all;
}
const SYNC_FIELDS=["servicio","comprobante","importe","iva","fecha_emision","fecha_vencimiento","comentarios","referencia","total_usd","tc"];
async function importRows(rows){
  const existing=await fetchClaves();
  const map=new Map(existing.map(r=>[r.clave,r]));
  const nuevas=[],updates=[];
  for(const r of rows){
    const e=map.get(r.clave);
    if(!e){nuevas.push(r);continue;}
    const patch={};
    for(const f of SYNC_FIELDS){
      const nv=r[f]==null?null:r[f], ov=e[f]==null?null:e[f];
      if(typeof nv==="number"||typeof ov==="number"){if(Number(nv||0)!==Number(ov||0))patch[f]=nv;}
      else if((nv||"")!==(ov||""))patch[f]=nv;
    }
    if(e.estado!=="Cobrado"&&r.estado!=="Pendiente"&&r.estado!==e.estado){patch.estado=r.estado;patch.medio_pago=r.medio_pago;patch.fecha_pago=r.fecha_pago;}
    if(Object.keys(patch).length)updates.push({id:e.id,patch});
  }
  for(let i=0;i<nuevas.length;i+=400){
    const {error}=await sb.from("facturas").upsert(nuevas.slice(i,i+400),{onConflict:"clave",ignoreDuplicates:true});
    if(error)throw error;
  }
  for(const u of updates){
    const {error}=await sb.from("facturas").update(u.patch).eq("id",u.id);
    if(error)throw error;
  }
  return {nuevas:nuevas.length,actualizadas:updates.length};
}
async function updateInvoice(id,patch){const {error}=await sb.from("facturas").update(patch).eq("id",id);if(error)throw error;}
async function fetchClientes(){const {data,error}=await sb.from("clientes").select("*").order("nombre");if(error)throw error;return data||[];}
async function saveClienteDB(c){
  const payload={nombre:c.nombre,contactos:c.contactos,notas:c.notas};
  if(c.id){const {error}=await sb.from("clientes").update(payload).eq("id",c.id);if(error)throw error;}
  else{const {error}=await sb.from("clientes").upsert(payload,{onConflict:"nombre"});if(error)throw error;}
}
async function deleteClienteDB(id){const {error}=await sb.from("clientes").delete().eq("id",id);if(error)throw error;}
async function fetchCostos(){const {data,error}=await sb.from("costos").select("*").order("servicio");if(error)throw error;return data||[];}
async function saveCostoDB(c){
  const payload={concepto:c.concepto,servicio:c.servicio,monto:c.monto,moneda:c.moneda,notas:c.notas};
  if(c.id){const {error}=await sb.from("costos").update(payload).eq("id",c.id);if(error)throw error;}
  else{const {error}=await sb.from("costos").insert(payload);if(error)throw error;}
}
async function deleteCostoDB(id){const {error}=await sb.from("costos").delete().eq("id",id);if(error)throw error;}
async function fetchConfig(){const {data,error}=await sb.from("config").select("*");if(error)throw error;const o={};(data||[]).forEach(r=>o[r.clave]=r.valor);return o;}
async function saveConfigDB(clave,valor){const {error}=await sb.from("config").upsert({clave,valor},{onConflict:"clave"});if(error)throw error;}
const deudaPorCliente=invoices=>{const m={};invoices.forEach(i=>{if(i.estado==="Pendiente"){const k=i.cliente.toLowerCase();m[k]=m[k]||{cliente:i.cliente,usd:0};m[k].usd+=usdOf(i);}});return m;};

/* ---------- UI básica ---------- */
function Badge({estado}){const s=EST_STYLE[estado]||EST_STYLE.Pendiente;return <span className="badge" style={{background:s.bg,color:s.fg}}>{estado}</span>;}

function CobrarModal({inv,onClose,onConfirm}){
  const [fecha,setFecha]=useState(todayISO());
  const [medio,setMedio]=useState(inv.medio_pago||"Santander");
  const [ref,setRef]=useState(inv.referencia||"");
  return <div className="modal-bg" onClick={onClose}>
    <div className="card" style={{padding:24,width:"100%",maxWidth:420}} onClick={e=>e.stopPropagation()}>
      <h3 className="font-display" style={{margin:"0 0 4px",fontSize:20}}>Marcar como cobrada</h3>
      <p style={{color:"var(--muted-fg)",fontSize:14,marginTop:0}}>{inv.cliente} · {inv.numeracion} · <span className="num">{fmtMoney(inv.total,inv.moneda)}</span></p>
      <label style={{fontSize:12,fontWeight:600,color:"var(--muted-fg)"}}>Fecha de pago</label>
      <input type="date" className="input" value={fecha} onChange={e=>setFecha(e.target.value)} style={{margin:"4px 0 12px"}}/>
      <label style={{fontSize:12,fontWeight:600,color:"var(--muted-fg)"}}>Medio de pago</label>
      <select className="input" value={medio} onChange={e=>setMedio(e.target.value)} style={{margin:"4px 0 12px"}}>
        {["Santander","Itau","Blex","Dlocal","Cheque","Koywe","Transferencia","Otro"].map(m=><option key={m}>{m}</option>)}
      </select>
      <label style={{fontSize:12,fontWeight:600,color:"var(--muted-fg)"}}>Referencia (opcional)</label>
      <input className="input" value={ref} onChange={e=>setRef(e.target.value)} style={{margin:"4px 0 18px"}} placeholder="Nº de transferencia, recibo…"/>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" onClick={()=>onConfirm({fecha_pago:fecha,medio_pago:medio,referencia:ref})}>✓ Confirmar</button>
      </div>
    </div>
  </div>;
}

/* ---------- Pendientes ---------- */
function Pendientes({invoices,onMark,clientes,datosCobro}){
  const [groupBy,setGroupBy]=useState("cliente");
  const [q,setQ]=useState("");
  const [soloVenc,setSoloVenc]=useState(false);
  const [open,setOpen]=useState({});
  const [cobrar,setCobrar]=useState(null);
  const hoy=todayISO();
  const cliMap=useMemo(()=>{const m={};(clientes||[]).forEach(c=>m[(c.nombre||"").toLowerCase()]=c);return m;},[clientes]);
  const pend=useMemo(()=>{const qq=q.trim().toLowerCase();return invoices.filter(i=>i.estado==="Pendiente"
    &&(!soloVenc||(i.fecha_vencimiento&&i.fecha_vencimiento<hoy))
    &&(!qq||`${i.cliente} ${i.numeracion} ${i.referencia}`.toLowerCase().includes(qq)));},[invoices,q,soloVenc]);
  const groups=useMemo(()=>{const m={};pend.forEach(i=>{const k=groupBy==="cliente"?i.cliente:monthKey(i.mes||i.fecha_emision);
    m[k]=m[k]||{key:k,items:[],usd:0,venc:0};m[k].items.push(i);
    if(i.fecha_vencimiento&&i.fecha_vencimiento<hoy)m[k].venc++;
    m[k].usd+=usdOf(i);});
    const a=Object.values(m);a.forEach(g=>g.items.sort((x,y)=>(y.mes||"").localeCompare(x.mes||"")));
    if(groupBy==="mes")a.sort((x,y)=>y.key.localeCompare(x.key));
    else a.sort((x,y)=>y.usd-x.usd);
    return a;},[pend,groupBy]);
  const grandUsd=useMemo(()=>pend.reduce((s,i)=>s+usdOf(i),0),[pend]);
  const sinTc=useMemo(()=>pend.filter(i=>!hasUsd(i)).length,[pend]);

  return <div>
    <div className="card" style={{padding:16,marginBottom:16}}>
      <div style={{display:"flex",flexWrap:"wrap",gap:12,alignItems:"center"}}>
        <span style={{fontSize:14,fontWeight:600,color:"var(--muted-fg)"}}>Agrupar por:</span>
        <div style={{display:"flex",background:"var(--muted-bg)",borderRadius:11,padding:4}}>
          {[["cliente","Cliente"],["mes","Mes"]].map(([k,l])=>
            <button key={k} onClick={()=>{setGroupBy(k);setOpen({});}} className="tab" style={groupBy===k?{background:"var(--card)",color:"var(--fg)"}:{}}>{l}</button>)}
        </div>
        <button className="btn" onClick={()=>setSoloVenc(v=>!v)} style={soloVenc?{background:"var(--bad-bg)",color:"var(--bad)",border:"1px solid var(--bad)"}:{background:"var(--card)",color:"var(--muted-fg)",border:"1px solid var(--border)"}}>{soloVenc?"● Solo vencidas":"Solo vencidas"}</button>
        <input className="input" style={{flex:1,minWidth:180}} value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar cliente o factura…"/>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:"4px 22px",marginTop:12,fontSize:14,color:"var(--muted-fg)"}}>
        <span><b style={{color:"var(--fg)"}}>{pend.length}</b> por cobrar</span>
        <span><b style={{color:"var(--fg)"}}>{groups.length}</b> {groupBy==="cliente"?"clientes":"meses"}</span>
        <span>Total por cobrar: <b className="num" style={{color:"var(--warn)"}}>{fmtUSD(grandUsd)}</b></span>
        {sinTc>0&&<span style={{color:"var(--bad)"}}>{sinTc} sin tipo de cambio (no suman)</span>}
      </div>
    </div>
    {groups.length===0&&<div className="card" style={{padding:40,textAlign:"center",color:"var(--muted-fg)"}}>No hay pendientes con estos filtros. ¡Todo cobrado!</div>}
    {groups.map(g=>{const o=open[g.key];return <div key={g.key} className="card" style={{marginBottom:12,overflow:"hidden"}}>
      <button onClick={()=>setOpen(s=>({...s,[g.key]:!s[g.key]}))} style={{width:"100%",display:"flex",alignItems:"center",gap:12,padding:"12px 16px",background:"none",border:"none",cursor:"pointer",textAlign:"left"}}>
        <span style={{color:"var(--muted-fg)",transform:o?"rotate(90deg)":"none"}}>▸</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:600}}>{groupBy==="cliente"?g.key:monthLabel(g.key)}</div>
          <div style={{fontSize:12,color:"var(--muted-fg)",display:"flex",gap:8}}>
            <span>{g.items.length} factura{g.items.length!==1?"s":""}</span>
            {g.venc>0&&<span className="badge" style={{background:"var(--bad-bg)",color:"var(--bad)"}}>{g.venc} vencida{g.venc!==1?"s":""}</span>}
          </div>
        </div>
        <div className="num" style={{fontWeight:600,color:"var(--warn)",fontSize:14}}>{fmtUSD(g.usd)}</div>
      </button>
      {o&&<div style={{borderTop:"1px solid var(--border)"}}>
        {groupBy==="cliente"&&(()=>{const c=cliMap[g.key.toLowerCase()];const cs=c&&c.contactos&&c.contactos.length?c.contactos:null;
          const primer=cs?cs.find(x=>x.telefono):null;
          const tel=primer?(primer.telefono||"").replace(/[^0-9]/g,""):"";
          const msg=encodeURIComponent(`Hola${primer&&primer.nombre?" "+primer.nombre:""}, te recordamos que figura un saldo pendiente de ${fmtUSD(g.usd)}. Para abonar:\n${datosCobro||"(datos de cobro no cargados)"}\n¡Gracias!`);
          return <div style={{padding:"10px 16px",background:"var(--muted-bg)",fontSize:13}}>
            {cs?<div style={{display:"flex",flexWrap:"wrap",gap:"6px 18px",alignItems:"center"}}>
              {cs.map((ct,i)=><ContactoInline key={i} c={ct}/>)}
            </div>:<span style={{color:"var(--muted-fg)"}}>Sin contactos cargados · agregalos en la pestaña Clientes</span>}
            {(tel||datosCobro)&&<div style={{marginTop:8,display:"flex",gap:8,flexWrap:"wrap"}}>
              {tel&&<a className="btn btn-primary" style={{padding:"5px 11px",textDecoration:"none"}} href={`https://wa.me/${tel}?text=${msg}`} target="_blank" rel="noreferrer">Recordar pago por WhatsApp</a>}
              {datosCobro&&<button className="btn btn-ghost" style={{padding:"5px 11px"}} onClick={()=>{navigator.clipboard&&navigator.clipboard.writeText(datosCobro);}}>Copiar datos de cobro</button>}
            </div>}
          </div>;})()}
        <div style={{overflowX:"auto"}}><table><tbody>
        {g.items.map(i=><tr key={i.id}>
          <td style={{fontWeight:600,whiteSpace:"nowrap"}}>{i.numeracion}</td>
          <td style={{color:"var(--muted-fg)"}}>{groupBy==="cliente"?monthLabel(monthKey(i.mes||i.fecha_emision)):i.cliente}</td>
          <td style={{color:"var(--muted-fg)"}}>{i.servicio}</td>
          <td className="num" style={{fontWeight:600,whiteSpace:"nowrap"}}>{hasUsd(i)?fmtUSD(usdOf(i)):<span style={{color:"var(--bad)"}} title="Sin tipo de cambio">s/TC</span>}{i.moneda!=="USD"&&<span style={{color:"var(--muted-fg)",fontWeight:400,fontSize:12}}> · {fmtMoney(i.total,i.moneda)}</span>}</td>
          <td style={{fontSize:12,whiteSpace:"nowrap",color:i.fecha_vencimiento&&i.fecha_vencimiento<hoy?"var(--bad)":"var(--muted-fg)"}}>
            {!i.fecha_vencimiento?"—":i.fecha_vencimiento<hoy?`vencida hace ${Math.round((Date.parse(hoy)-Date.parse(i.fecha_vencimiento))/86400000)} d`:`vence ${i.fecha_vencimiento}`}</td>
          <td style={{textAlign:"right",whiteSpace:"nowrap"}}>
            <button className="btn btn-primary" style={{padding:"6px 11px"}} onClick={()=>setCobrar(i)}>✓ Cobrada</button>
            <button className="btn btn-ghost" style={{padding:"6px 9px",marginLeft:4,color:"var(--bad)"}} title="Perdida" onClick={()=>{if(confirm("¿Marcar como perdida (incobrable)?"))onMark(i.id,{estado:"Perdido"});}}>⚠</button>
          </td>
        </tr>)}
      </tbody></table></div></div>}
    </div>;})}
    {cobrar&&<CobrarModal inv={cobrar} onClose={()=>setCobrar(null)} onConfirm={d=>{onMark(cobrar.id,{estado:"Cobrado",...d});setCobrar(null);}}/>}
  </div>;
}

/* ---------- Gráfica lineal (SVG) ---------- */
const SERVICIOS=["TuFud","TuShopper","Deri","Scrapper","Otro"];
const SERV_COLOR={Total:"#0f5c4a",TuFud:"#3b6cf4",TuShopper:"#0f8a5f",Deri:"#b8791b",Scrapper:"#14a3b8",Otro:"#9b59b6",Costo:"#c0392b"};
function LineChart({data,series,height=290,fmtY}){
  const [toggled,setToggled]=useState({});
  const isHidden=s=>toggled[s.key]!==undefined?toggled[s.key]:!!s.off;
  const W=720,H=height,padL=52,padR=14,padT=14,padB=30;
  const active=series.filter(s=>!isHidden(s));
  const maxV=Math.max(1,...data.flatMap(d=>active.map(s=>d[s.key]||0)));
  const n=data.length;
  const x=i=>padL+(n<=1?0:i*(W-padL-padR)/(n-1));
  const y=v=>padT+(H-padT-padB)*(1-v/maxV);
  const ticks=[0,1,2,3,4].map(i=>maxV*i/4);
  const skip=Math.ceil(n/9);
  if(!n)return <div style={{padding:24,color:"var(--muted-fg)"}}>Sin datos para esta moneda.</div>;
  return <div>
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}}>
      {ticks.map((tv,i)=><g key={i}>
        <line x1={padL} x2={W-padR} y1={y(tv)} y2={y(tv)} stroke="var(--grid)"/>
        <text x={padL-6} y={y(tv)+3} textAnchor="end" fontSize="10" fill="var(--muted-fg)">{fmtY?fmtY(tv):Math.round(tv)}</text>
      </g>)}
      {data.map((d,i)=>(n<=9||i%skip===0||i===n-1)?<text key={i} x={x(i)} y={H-9} textAnchor="middle" fontSize="10" fill="var(--muted-fg)">{d.label}</text>:null)}
      {active.map(s=>{
        const pts=data.map((d,i)=>`${x(i)},${y(d[s.key]||0)}`).join(" ");
        return <g key={s.key}>
          <polyline points={pts} fill="none" stroke={s.color} strokeWidth={s.dash?1.8:2.2} strokeDasharray={s.dash?"6 4":undefined}/>
          {!s.dash&&data.map((d,i)=><circle key={i} cx={x(i)} cy={y(d[s.key]||0)} r="2.6" fill={s.color}><title>{`${s.label} · ${d.label}: ${fmtY?fmtY(d[s.key]||0):d[s.key]||0}`}</title></circle>)}
        </g>;
      })}
    </svg>
    <div style={{display:"flex",flexWrap:"wrap",gap:14,marginTop:6}}>
      {series.map(s=><button key={s.key} onClick={()=>setToggled(t=>({...t,[s.key]:!isHidden(s)}))} style={{display:"inline-flex",alignItems:"center",gap:6,background:"none",border:"none",cursor:"pointer",opacity:isHidden(s)?.35:1,fontSize:13,color:"var(--fg)",padding:0}}>
        <span style={{width:16,height:s.dash?0:3,borderTop:s.dash?`2px dashed ${s.color}`:"none",borderRadius:2,background:s.dash?"none":s.color,display:"inline-block"}}/>{s.label}
      </button>)}
    </div>
  </div>;
}

/* ---------- Gráfica de barras (SVG) ---------- */
function BarChart({data,bars,segColors,segLabels,height=300,fmtY}){
  const W=720,H=height,padL=54,padR=14,padT=14,padB=48;
  const barTotal=(d,b)=>b.keys.reduce((s,k)=>s+(d[k]||0),0);
  const maxV=Math.max(1,...data.flatMap(d=>bars.map(b=>barTotal(d,b))));
  const n=data.length||1;
  const groupW=(W-padL-padR)/n;
  const gap=6,innerPad=groupW*0.16;
  const barW=Math.max(4,(groupW-2*innerPad-(bars.length-1)*gap)/bars.length);
  const y=v=>padT+(H-padT-padB)*(1-v/maxV);
  const y0=y(0);
  const ticks=[0,1,2,3,4].map(i=>maxV*i/4);
  const legendKeys=[];bars.forEach(b=>b.keys.forEach(k=>{if(!legendKeys.includes(k))legendKeys.push(k);}));
  return <div>
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}}>
      {ticks.map((tv,i)=><g key={i}>
        <line x1={padL} x2={W-padR} y1={y(tv)} y2={y(tv)} stroke="var(--grid)"/>
        <text x={padL-6} y={y(tv)+3} textAnchor="end" fontSize="10" fill="var(--muted-fg)">{fmtY?fmtY(tv):Math.round(tv)}</text>
      </g>)}
      {data.map((d,gi)=>{const gx=padL+gi*groupW+innerPad;const net=barTotal(d,bars[0])-barTotal(d,bars[1]);
        return <g key={gi}>
          {bars.map((b,bi)=>{const x=gx+bi*(barW+gap);let acc=0;
            return b.keys.map((k,ki)=>{const val=d[k]||0;const yTop=y(acc+val);const h=Math.max(0,y(acc)-y(acc+val));acc+=val;
              return <rect key={ki} x={x} y={yTop} width={barW} height={h} fill={segColors[k]}><title>{`${d.label} · ${segLabels[k]}: ${fmtY?fmtY(val):val}`}</title></rect>;});})}
          <text x={padL+gi*groupW+groupW/2} y={H-28} textAnchor="middle" fontSize="12" fontWeight="600" fill="var(--fg)">{d.label}</text>
          <text x={padL+gi*groupW+groupW/2} y={H-12} textAnchor="middle" fontSize="11" fill={net>=0?"var(--ok)":"var(--bad)"}>{(net>=0?"+":"")+(fmtY?fmtY(net):net)}</text>
        </g>;})}
    </svg>
    <div style={{display:"flex",flexWrap:"wrap",gap:14,marginTop:6}}>
      {legendKeys.map(k=><span key={k} style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:13,color:"var(--fg)"}}>
        <span style={{width:14,height:12,borderRadius:3,background:segColors[k],display:"inline-block"}}/>{segLabels[k]}
      </span>)}
    </div>
  </div>;
}

/* ---------- Resumen ---------- */
function Resumen({invoices,costos}){
  const [barSel,setBarSel]=useState("avg6");
  const t=useMemo(()=>{const o={Cobrado:0,Pendiente:0,Perdido:0};invoices.forEach(i=>{if(o[i.estado]!=null)o[i.estado]+=usdOf(i);});return o;},[invoices]);
  const sinTc=useMemo(()=>invoices.filter(i=>(i.estado==="Cobrado"||i.estado==="Pendiente"||i.estado==="Perdido")&&!hasUsd(i)).length,[invoices]);
  const Kpi=({label,val,color})=><div className="card" style={{padding:20}}>
    <div style={{fontWeight:600,marginBottom:6,color}}>{label}</div>
    <div className="num" style={{fontWeight:700,fontSize:24}}>{fmtUSD(val)}</div>
  </div>;

  // costos mensuales en USD (los items cargados en USD)
  const costoMensual=useMemo(()=>(costos||[]).filter(c=>c.moneda==="USD").reduce((s,c)=>s+Number(c.monto||0),0),[costos]);
  const costoNoUsd=useMemo(()=>(costos||[]).filter(c=>c.moneda!=="USD").length,[costos]);
  const costServ=useMemo(()=>{const o={TuFud:0,TuShopper:0,Deri:0,Scrapper:0,Otro:0};(costos||[]).forEach(c=>{if(c.moneda==="USD"&&o[c.servicio]!=null)o[c.servicio]+=Number(c.monto||0);});return o;},[costos]);

  // facturación mensual por servicio en USD (excluye Anuladas y Neteadas)
  const chart=useMemo(()=>{
    const m={};
    invoices.forEach(i=>{
      if(i.estado==="Anulado"||i.estado==="Neteado")return;
      const mk=monthKey(i.mes||i.fecha_emision);if(!mk)return;
      const s=SERVICIOS.includes(i.servicio)?i.servicio:"Otro";
      m[mk]=m[mk]||{mk,Total:0,TuFud:0,TuShopper:0,Deri:0,Scrapper:0,Otro:0};
      const v=usdOf(i);m[mk][s]+=v;m[mk].Total+=v;
    });
    return Object.values(m).sort((a,b)=>a.mk.localeCompare(b.mk)).map(r=>({...r,label:monthLabel(r.mk),Costo:costoMensual,cTuFud:costServ.TuFud,cTuShopper:costServ.TuShopper,cDeri:costServ.Deri,cScrapper:costServ.Scrapper,cOtro:costServ.Otro}));
  },[invoices,costoMensual,costServ]);

  const series=[{key:"Total",color:SERV_COLOR.Total,label:"Total"},...SERVICIOS.map(s=>({key:s,color:SERV_COLOR[s],label:s}))];
  if(costoMensual>0)series.push({key:"Costo",color:SERV_COLOR.Costo,label:"Costo total",dash:true});
  [["cTuFud","TuFud"],["cTuShopper","TuShopper"],["cDeri","Deri"],["cScrapper","Scrapper"],["cOtro","Otro"]].forEach(([k,s])=>{if(costServ[s]>0)series.push({key:k,color:SERV_COLOR[s],label:"Costo "+s,dash:true,off:true});});
  const ultimo=chart.length?chart[chart.length-1]:null;
  const resultado=ultimo?ultimo.Total-costoMensual:0;

  const barData=useMemo(()=>{
    const map={avg6:[6,"avg"],avg12:[12,"avg"],acc6:[6,"acc"],acc12:[12,"acc"],last1:[1,"avg"]};
    const [N,mode]=map[barSel]||[6,"avg"];
    const win=chart.slice(-N);const cnt=win.length||1;const mset=new Set(win.map(r=>r.mk));
    const rev={};["TuFud","TuShopper","Deri","Scrapper","Otro"].forEach(s=>rev[s]={Cobrado:0,Pendiente:0});
    invoices.forEach(i=>{if(i.estado!=="Cobrado"&&i.estado!=="Pendiente")return;const mk=monthKey(i.mes||i.fecha_emision);if(!mset.has(mk))return;const s=SERVICIOS.includes(i.servicio)?i.servicio:"Otro";rev[s][i.estado]+=usdOf(i);});
    const cost={};(costos||[]).forEach(c=>{if(c.moneda==="USD")cost[c.servicio]=(cost[c.servicio]||0)+Number(c.monto||0);});
    const inF=mode==="avg"?(1/cnt):1;const costF=mode==="avg"?1:cnt;
    const rows=["TuFud","TuShopper","Deri","Scrapper","Otro"].map(s=>({label:s,Cobrado:rev[s].Cobrado*inF,Pendiente:rev[s].Pendiente*inF,Egresos:(cost[s]||0)*costF}));
    if((cost.General||0)>0)rows.push({label:"General",Cobrado:0,Pendiente:0,Egresos:cost.General*costF});
    return rows;
  },[chart,invoices,costos,barSel]);

  return <div style={{display:"flex",flexDirection:"column",gap:16}}>
    <div style={{display:"grid",gap:16,gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))"}}>
      <Kpi label="Cobrado" val={t.Cobrado} color="var(--ok)"/>
      <Kpi label="Por cobrar" val={t.Pendiente} color="var(--warn)"/>
      <Kpi label="Perdido" val={t.Perdido} color="var(--bad)"/>
    </div>
    {sinTc>0&&<div className="card" style={{padding:"10px 16px",fontSize:13,color:"var(--bad)"}}>{sinTc} factura(s) sin tipo de cambio en el Excel: no están sumando en dólares. Se corrige al importar un Excel con el TC cargado en esas filas.</div>}

    <div className="card" style={{padding:20}}>
      <h3 className="font-display" style={{margin:"0 0 4px",fontSize:19}}>Facturación por servicio (USD)</h3>
      <p style={{margin:"0 0 10px",fontSize:12,color:"var(--muted-fg)"}}>Total facturado por mes y por servicio, consolidado en dólares. Tocá la leyenda para mostrar/ocultar líneas.{costoMensual>0?" La línea punteada “Costo total” es tu costo mensual global; también podés prender el “Costo [servicio]” de cada sistema para compararlo con su facturación.":""}</p>
      <LineChart data={chart} series={series} fmtY={v=>"US$ "+(Math.abs(v)>=1000?(v/1000).toFixed(0)+"k":Math.round(v))}/>
    </div>

    <div className="card" style={{padding:20}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10,marginBottom:8}}>
        <h3 className="font-display" style={{margin:0,fontSize:19}}>Ingresos vs Egresos por sistema (USD)</h3>
        <select className="input" style={{width:"auto"}} value={barSel} onChange={e=>setBarSel(e.target.value)}>
          <option value="avg6">Promedio mensual · 6 meses</option>
          <option value="avg12">Promedio mensual · 12 meses</option>
          <option value="acc6">Acumulado · 6 meses</option>
          <option value="acc12">Acumulado · 12 meses</option>
          <option value="last1">Último mes</option>
        </select>
      </div>
      <p style={{margin:"0 0 10px",fontSize:12,color:"var(--muted-fg)"}}>{barSel.startsWith("acc")?"Ingreso = facturación total del período (cobrado + por cobrar, apilados). Egreso = costo mensual × meses. El número bajo cada sistema es el resultado acumulado.":"Ingreso = facturación mensual promedio: cobrado (verde) + por cobrar (ámbar), apilados. Egreso = costo mensual del sistema. El número bajo cada sistema es el resultado (no incluye lo perdido)."}</p>
      <BarChart data={barData}
        bars={[{label:"Ingresos",keys:["Cobrado","Pendiente"]},{label:"Egresos",keys:["Egresos"]}]}
        segColors={{Cobrado:"var(--ok)",Pendiente:"var(--warn)",Egresos:"var(--bad)"}}
        segLabels={{Cobrado:"Cobrado",Pendiente:"Por cobrar",Egresos:"Egresos"}}
        fmtY={v=>"US$ "+(Math.abs(v)>=1000?(v/1000).toFixed(1)+"k":Math.round(v))}/>
    </div>

    {costoMensual>0&&ultimo&&<div className="card" style={{padding:20}}>
      <h3 className="font-display" style={{margin:"0 0 4px",fontSize:19}}>Resultado — {ultimo.label} (USD)</h3>
      <div style={{display:"grid",gap:12,gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",marginTop:10}}>
        <div><div style={{fontSize:12,color:"var(--muted-fg)"}}>Facturado</div><div className="num" style={{fontSize:20,fontWeight:700}}>{fmtUSD(ultimo.Total)}</div></div>
        <div><div style={{fontSize:12,color:"var(--muted-fg)"}}>Costo mensual</div><div className="num" style={{fontSize:20,fontWeight:700,color:"var(--bad)"}}>{fmtUSD(costoMensual)}</div></div>
        <div><div style={{fontSize:12,color:"var(--muted-fg)"}}>Resultado</div><div className="num" style={{fontSize:20,fontWeight:700,color:resultado>=0?"var(--ok)":"var(--bad)"}}>{fmtUSD(resultado)}</div></div>
      </div>
      {costoNoUsd>0&&<p style={{marginTop:12,fontSize:12,color:"var(--bad)"}}>Tenés {costoNoUsd} costo(s) cargado(s) en otra moneda que no se están sumando. Para el resultado en dólares, cargá los costos en USD.</p>}
    </div>}
  </div>;
}

/* ---------- Importar ---------- */
function Importar({onDone,total}){
  const [busy,setBusy]=useState(false);const [msg,setMsg]=useState("");const [err,setErr]=useState("");
  const onFile=async e=>{const f=e.target.files?.[0];if(!f)return;setErr("");setMsg("");setBusy(true);
    try{const rows=parseWorkbook(await f.arrayBuffer());setMsg(`Procesando ${rows.length} filas…`);
      const res=await importRows(rows);await onDone();
      setMsg(`Listo: ${res.nuevas} factura(s) nueva(s) registrada(s) y ${res.actualizadas} marcada(s) como cobrada(s) desde el Excel. El resto quedó igual.`);}
    catch(ex){setErr(ex.message||String(ex));}setBusy(false);e.target.value="";};
  return <div className="card" style={{padding:24,maxWidth:620}}>
    <h3 className="font-display" style={{fontSize:20,margin:"0 0 4px"}}>Subir el Excel del mes</h3>
    <p style={{color:"var(--muted-fg)",fontSize:14}}>Leo la hoja <b>FACTURACION_OMNILOG</b>, agrego las facturas nuevas y, si en el Excel marcaste como pagada una que estaba pendiente, la paso a cobrada. Lo que ya marcaste como cobrado en la web no se pisa.</p>
    <label className="btn btn-primary" style={{cursor:"pointer"}}>📄 Elegir archivo .xlsx<input type="file" accept=".xlsx,.xls" onChange={onFile} style={{display:"none"}}/></label>
    {busy&&<span style={{marginLeft:10,color:"var(--muted-fg)"}}>Trabajando…</span>}
    {msg&&<div style={{marginTop:16,padding:12,borderRadius:11,background:"var(--ok-bg)",color:"var(--ok)",fontSize:14}}>{msg}</div>}
    {err&&<div style={{marginTop:16,padding:12,borderRadius:11,background:"var(--bad-bg)",color:"var(--bad)",fontSize:14}}>{err}</div>}
    <p style={{marginTop:18,fontSize:13,color:"var(--muted-fg)"}}>En la base hay <b style={{color:"var(--fg)"}}>{total}</b> facturas.</p>
  </div>;
}

      <h3 className="font-display" style={{fontSize:20,margin:"0 0 12px"}}>{cliente?"Editar cliente":"Nuevo cliente"}</h3>
      <label style={{fontSize:12,fontWeight:600,color:"var(--muted-fg)"}}>Empresa</label>
      <input className="input" list="fact-clientes" value={nombre} onChange={e=>setNombre(e.target.value)} style={{margin:"4px 0 4px"}} placeholder="Razón social / nombre"/>
      <datalist id="fact-clientes">{invoiceNames.map(n=><option key={n} value={n}/>)}</datalist>
      <p style={{fontSize:12,color:"var(--muted-fg)",margin:"0 0 14px"}}>Elegí el nombre tal como aparece en las facturas para que se asocie la deuda. La lista te sugiere los que ya tenés facturados.</p>
      <label style={{fontSize:12,fontWeight:600,color:"var(--muted-fg)"}}>Contactos</label>
      {contactos.map((c,i)=><div key={i} style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr auto",gap:6,margin:"6px 0"}}>
        <input className="input" value={c.nombre} onChange={e=>setC(i,"nombre",e.target.value)} placeholder="Nombre"/>
        <input className="input" value={c.email} onChange={e=>setC(i,"email",e.target.value)} placeholder="Email"/>
        <input className="input" value={c.telefono} onChange={e=>setC(i,"telefono",e.target.value)} placeholder="Celular"/>
        <button className="btn btn-ghost" style={{padding:"0 10px",color:"var(--bad)"}} onClick={()=>delC(i)} title="Quitar">✕</button>
      </div>)}
      <button className="btn btn-ghost" style={{marginTop:4}} onClick={addC}>+ Agregar contacto</button>
      <label style={{fontSize:12,fontWeight:600,color:"var(--muted-fg)",display:"block",margin:"16px 0 4px"}}>Notas (opcional)</label>
      <textarea className="input" rows={2} value={notas} onChange={e=>setNotas(e.target.value)} placeholder="Datos de cobranza, condiciones, etc."/>
      {err&&<div style={{marginTop:12,padding:10,borderRadius:10,background:"var(--bad-bg)",color:"var(--bad)",fontSize:13}}>{err}</div>}
      <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:18}}>
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" onClick={submit} disabled={busy}>{busy?"Guardando…":"Guardar"}</button>
      </div>
    </div>
  </div>;
}

function DatosCobro({valor,onSave}){
  const [txt,setTxt]=useState(valor||"");const [busy,setBusy]=useState(false);const [ok,setOk]=useState(false);
  useEffect(()=>{setTxt(valor||"");},[valor]);
  const save=async()=>{setBusy(true);setOk(false);try{await onSave(txt);setOk(true);setTimeout(()=>setOk(false),2000);}catch(e){}setBusy(false);};
  return <div className="card" style={{padding:16,marginBottom:16}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
      <b>Datos de cobro (CVU / alias para pasar a los deudores)</b>
      <button className="btn btn-primary" style={{padding:"6px 12px"}} onClick={save} disabled={busy}>{busy?"…":"Guardar"}</button>
    </div>
    <textarea className="input" rows={3} value={txt} onChange={e=>setTxt(e.target.value)} style={{marginTop:8,fontFamily:"inherit"}} placeholder={"Ej.\nCVU: 0000000000000000000000\nAlias: dixtra.cobros\nTitular: Tolenka SRL"}/>
    <p style={{margin:"6px 0 0",fontSize:12,color:"var(--muted-fg)"}}>Se usa en el botón “Recordar pago por WhatsApp” de cada deudor en Pendientes. Actualizalo cuando cambie el CVU.{ok&&<b style={{color:"var(--ok)"}}> Guardado.</b>}</p>
  </div>;
}

function ClientesView({clientes,invoices,onSave,onDelete,datosCobro,onSaveDatos}){
  const [q,setQ]=useState("");const [editing,setEditing]=useState(undefined); // undefined=cerrado, null=nuevo, obj=editar
  const invoiceNames=useMemo(()=>[...new Set(invoices.map(i=>i.cliente))].sort(),[invoices]);
  const deuda=useMemo(()=>deudaPorCliente(invoices),[invoices]);
  const list=clientes.filter(c=>(c.nombre||"").toLowerCase().includes(q.trim().toLowerCase()));
  return <div>
    <DatosCobro valor={datosCobro} onSave={onSaveDatos}/>
    <div className="card" style={{padding:16,marginBottom:16,display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}>
      <input className="input" style={{flex:1,minWidth:200}} value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar empresa…"/>
      <button className="btn btn-primary" onClick={()=>setEditing(null)}>+ Nuevo cliente</button>
    </div>
    {clientes.length===0&&<div className="card" style={{padding:32,textAlign:"center",color:"var(--muted-fg)"}}>Todavía no cargaste clientes. Tocá “Nuevo cliente” para empezar a asociar contactos a las deudas.</div>}
    <div style={{display:"grid",gap:12,gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))"}}>
      {list.map(c=>{const d=deuda[(c.nombre||"").toLowerCase()];const dl=d&&d.usd?fmtUSD(d.usd):"";return <div key={c.id} className="card" style={{padding:16}}>
        <div style={{display:"flex",justifyContent:"space-between",gap:8,alignItems:"start"}}>
          <h4 style={{margin:0,fontWeight:600}}>{c.nombre}</h4>
          <div style={{display:"flex",gap:4}}>
            <button className="btn btn-ghost" style={{padding:"4px 9px"}} onClick={()=>setEditing(c)}>Editar</button>
            <button className="btn btn-ghost" style={{padding:"4px 9px",color:"var(--bad)"}} onClick={()=>{if(confirm("¿Eliminar este cliente? (no borra sus facturas)"))onDelete(c.id);}}>✕</button>
          </div>
        </div>
        <div style={{marginTop:6,fontSize:13}}>
          {dl?<span style={{color:"var(--warn)"}}>Debe: <b className="num">{dl}</b></span>:<span style={{color:"var(--ok)"}}>Sin deuda pendiente</span>}
        </div>
        <div style={{marginTop:10,paddingTop:10,borderTop:"1px solid var(--border)",display:"flex",flexDirection:"column",gap:6,fontSize:13}}>
          {c.contactos&&c.contactos.length?c.contactos.map((ct,i)=><ContactoInline key={i} c={ct}/>):<span style={{color:"var(--muted-fg)"}}>Sin contactos</span>}
        </div>
        {c.notas&&<p style={{marginTop:10,fontSize:12,color:"var(--muted-fg)"}}>{c.notas}</p>}
      </div>;})}
    </div>
    {editing!==undefined&&<ClienteForm cliente={editing} invoiceNames={invoiceNames} onClose={()=>setEditing(undefined)} onSave={onSave}/>}
  </div>;
}

/* ---------- Costos ---------- */
function CostoForm({costo,onClose,onSave}){
  const [f,setF]=useState(costo?{...costo}:{concepto:"",servicio:"General",monto:"",moneda:"USD",notas:""});
  const [busy,setBusy]=useState(false);const [err,setErr]=useState("");
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const submit=async()=>{
    if(!f.concepto.trim()||f.monto===""){setErr("Poné el concepto y el monto.");return;}
    setBusy(true);setErr("");
    try{await onSave({id:costo?costo.id:null,concepto:f.concepto.trim(),servicio:f.servicio,monto:Number(f.monto),moneda:f.moneda,notas:(f.notas||"").trim()});onClose();}
    catch(e){setErr(e.message||String(e));setBusy(false);}
  };
  return <div className="modal-bg" onClick={onClose}>
    <div className="card" style={{padding:24,width:"100%",maxWidth:480}} onClick={e=>e.stopPropagation()}>
      <h3 className="font-display" style={{fontSize:20,margin:"0 0 12px"}}>{costo?"Editar costo":"Nuevo costo mensual"}</h3>
      <label style={{fontSize:12,fontWeight:600,color:"var(--muted-fg)"}}>Concepto</label>
      <input className="input" value={f.concepto} onChange={e=>set("concepto",e.target.value)} style={{margin:"4px 0 12px"}} placeholder="Ej. Servidores AWS, licencia, sueldo mantenimiento…"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
        <div><label style={{fontSize:12,fontWeight:600,color:"var(--muted-fg)"}}>Servicio</label>
          <select className="input" value={f.servicio} onChange={e=>set("servicio",e.target.value)}>{["General",...SERVICIOS].map(s=><option key={s}>{s}</option>)}</select></div>
        <div><label style={{fontSize:12,fontWeight:600,color:"var(--muted-fg)"}}>Monto / mes</label>
          <input className="input num" type="number" value={f.monto} onChange={e=>set("monto",e.target.value)} placeholder="0.00"/></div>
        <div><label style={{fontSize:12,fontWeight:600,color:"var(--muted-fg)"}}>Moneda</label>
          <select className="input" value={f.moneda} onChange={e=>set("moneda",e.target.value)}>{CURRENCIES.map(c=><option key={c}>{c}</option>)}</select></div>
      </div>
      <label style={{fontSize:12,fontWeight:600,color:"var(--muted-fg)",display:"block",margin:"12px 0 4px"}}>Notas (opcional)</label>
      <input className="input" value={f.notas} onChange={e=>set("notas",e.target.value)}/>
      {err&&<div style={{marginTop:12,padding:10,borderRadius:10,background:"var(--bad-bg)",color:"var(--bad)",fontSize:13}}>{err}</div>}
      <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:18}}>
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" onClick={submit} disabled={busy}>{busy?"Guardando…":"Guardar"}</button>
      </div>
    </div>
  </div>;
}

function CostosView({costos,onSave,onDelete}){
  const [editing,setEditing]=useState(undefined);
  const totalPorMoneda=useMemo(()=>{const t={};costos.forEach(c=>t[c.moneda]=(t[c.moneda]||0)+Number(c.monto||0));return t;},[costos]);
  const grupos=useMemo(()=>{const g={};costos.forEach(c=>{g[c.servicio]=g[c.servicio]||[];g[c.servicio].push(c);});return g;},[costos]);
  const orden=["General",...SERVICIOS];
  return <div>
    <div className="card" style={{padding:16,marginBottom:16,display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}>
      <div style={{flex:1,minWidth:200}}>
        <div style={{fontSize:13,color:"var(--muted-fg)"}}>Costos mensuales totales</div>
        <div className="num" style={{fontWeight:700,fontSize:16}}>{CURRENCIES.filter(c=>totalPorMoneda[c]).map(c=>fmtMoney(totalPorMoneda[c],c)).join("  ·  ")||"—"}</div>
      </div>
      <button className="btn btn-primary" onClick={()=>setEditing(null)}>+ Nuevo costo</button>
    </div>
    {costos.length===0&&<div className="card" style={{padding:32,textAlign:"center",color:"var(--muted-fg)"}}>Todavía no cargaste costos. Agregá los gastos mensuales de mantenimiento (por servicio o generales) para ver la rentabilidad en el Resumen.</div>}
    {orden.filter(s=>grupos[s]).map(s=>{
      const items=grupos[s];const tot={};items.forEach(c=>tot[c.moneda]=(tot[c.moneda]||0)+Number(c.monto||0));
      return <div key={s} className="card" style={{padding:0,marginBottom:12,overflow:"hidden"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px",background:"var(--muted-bg)"}}>
          <b>{s==="General"?"Generales (todo el sistema)":s}</b>
          <span className="num" style={{fontSize:13,color:"var(--muted-fg)"}}>{CURRENCIES.filter(c=>tot[c]).map(c=>fmtMoney(tot[c],c)).join("  ·  ")}</span>
        </div>
        <div style={{overflowX:"auto"}}><table><tbody>
          {items.map(c=><tr key={c.id}>
            <td style={{fontWeight:500}}>{c.concepto}{c.notas&&<div style={{fontSize:12,color:"var(--muted-fg)"}}>{c.notas}</div>}</td>
            <td className="num" style={{fontWeight:600,whiteSpace:"nowrap"}}>{fmtMoney(c.monto,c.moneda)}</td>
            <td style={{textAlign:"right",whiteSpace:"nowrap"}}>
              <button className="btn btn-ghost" style={{padding:"4px 9px"}} onClick={()=>setEditing(c)}>Editar</button>
              <button className="btn btn-ghost" style={{padding:"4px 9px",marginLeft:4,color:"var(--bad)"}} onClick={()=>{if(confirm("¿Eliminar este costo?"))onDelete(c.id);}}>✕</button>
            </td>
          </tr>)}
        </tbody></table></div>
      </div>;
    })}
    {editing!==undefined&&<CostoForm costo={editing} onClose={()=>setEditing(undefined)} onSave={onSave}/>}
  </div>;
}

/* ---------- Login ---------- */
function Login(){
  const [email,setEmail]=useState("");const [pass,setPass]=useState("");
  const [err,setErr]=useState("");const [busy,setBusy]=useState(false);
  const submit=async()=>{
    if(!email.trim()||!pass)return;
    setErr("");setBusy(true);
    const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:pass});
    if(error)setErr("Email o contraseña incorrectos.");
    setBusy(false);
  };
  const onKey=e=>{if(e.key==="Enter")submit();};
  return <div className="wrap" style={{maxWidth:400,paddingTop:64}}>
    <div style={{textAlign:"center",marginBottom:20}}>
      <span style={{display:"inline-grid",placeItems:"center",width:52,height:52,borderRadius:16,background:"var(--accent)",color:"#fff",fontSize:26}}>$</span>
      <h1 className="font-display" style={{margin:"12px 0 0",fontSize:26}}>Cobros Omnilog</h1>
      <p style={{color:"var(--muted-fg)",fontSize:14,marginTop:4}}>Ingresá para ver la cobranza</p>
    </div>
    <div className="card" style={{padding:24}}>
      <label style={{fontSize:12,fontWeight:600,color:"var(--muted-fg)"}}>Email</label>
      <input className="input" type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={onKey} style={{margin:"4px 0 12px"}} placeholder="tu@email.com"/>
      <label style={{fontSize:12,fontWeight:600,color:"var(--muted-fg)"}}>Contraseña</label>
      <input className="input" type="password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={onKey} style={{margin:"4px 0 18px"}} placeholder="••••••••"/>
      {err&&<div style={{marginBottom:12,padding:10,borderRadius:10,background:"var(--bad-bg)",color:"var(--bad)",fontSize:13}}>{err}</div>}
      <button className="btn btn-primary" style={{width:"100%",justifyContent:"center"}} onClick={submit} disabled={busy}>{busy?"Ingresando…":"Ingresar"}</button>
    </div>
  </div>;
}

/* ---------- App ---------- */
function App(){
  const [session,setSession]=useState(undefined); // undefined = verificando
  const [inv,setInv]=useState([]);const [clientes,setClientes]=useState([]);const [costos,setCostos]=useState([]);const [config,setConfig]=useState({});const [loading,setLoading]=useState(true);const [tab,setTab]=useState("pendientes");const [error,setError]=useState("");
  const load=useCallback(async()=>{setLoading(true);try{const [f,c,co,cf]=await Promise.all([fetchAll(),fetchClientes(),fetchCostos(),fetchConfig()]);setInv(f);setClientes(c);setCostos(co);setConfig(cf);setError("");}catch(e){setError(e.message||String(e));}setLoading(false);},[]);
  const reloadClientes=useCallback(async()=>{try{setClientes(await fetchClientes());}catch(e){setError(e.message||String(e));}},[]);
  const reloadCostos=useCallback(async()=>{try{setCostos(await fetchCostos());}catch(e){setError(e.message||String(e));}},[]);

  useEffect(()=>{
    if(!CONFIGURED){setSession(null);return;}
    sb.auth.getSession().then(({data})=>setSession(data.session));
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  useEffect(()=>{if(session)load();},[session]);

  const onMark=async(id,patch)=>{await updateInvoice(id,patch);setInv(prev=>prev.map(i=>i.id===id?{...i,...patch}:i));};
  const onSaveCliente=async(c)=>{await saveClienteDB(c);await reloadClientes();};
  const onDeleteCliente=async(id)=>{await deleteClienteDB(id);await reloadClientes();};
  const onSaveCosto=async(c)=>{await saveCostoDB(c);await reloadCostos();};
  const onDeleteCosto=async(id)=>{await deleteCostoDB(id);await reloadCostos();};
  const onSaveDatos=async(txt)=>{await saveConfigDB("datos_cobro",txt);setConfig(c=>({...c,datos_cobro:txt}));};
  const logout=async()=>{await sb.auth.signOut();setInv([]);setClientes([]);setCostos([]);setConfig({});};

  if(!CONFIGURED)return <div className="wrap"><div className="card" style={{padding:28}}>
    <h2 className="font-display">Falta configurar Supabase</h2>
    <p style={{color:"var(--muted-fg)"}}>Abrí este archivo con un editor de texto y pegá tu <b>Project URL</b> y tu <b>anon public key</b> en las dos líneas de arriba (bloque PASO 1). Después volvé a subirlo.</p>
  </div></div>;

  if(session===undefined)return <div className="wrap" style={{paddingTop:80,textAlign:"center",color:"var(--muted-fg)"}}>Cargando…</div>;
  if(!session)return <Login/>;

  const TABS=[["pendientes","Pendientes"],["dashboard","Resumen"],["facturas","Facturas"],["clientes","Clientes"],["costos","Costos"],["importar","Importar"]];
  return <div className="wrap">
    <header style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
      <span style={{display:"grid",placeItems:"center",width:44,height:44,borderRadius:14,background:"var(--accent)",color:"#fff",fontSize:22}}>$</span>
      <div style={{flex:1}}><h1 className="font-display" style={{margin:0,fontSize:24}}>Cobros Omnilog</h1>
      <div style={{fontSize:12,color:"var(--muted-fg)"}}>{inv.length} facturas en la base</div></div>
      <div style={{textAlign:"right"}}>
        <div style={{fontSize:12,color:"var(--muted-fg)"}}>{session.user?.email}</div>
        <button onClick={logout} style={{background:"none",border:"none",color:"var(--accent)",fontWeight:600,fontSize:13,cursor:"pointer",padding:0}}>Cerrar sesión</button>
      </div>
    </header>
    <nav className="card" style={{display:"inline-flex",gap:4,padding:4,marginBottom:20}}>
      {TABS.map(([k,l])=><button key={k} className={"tab"+(tab===k?" on":"")} onClick={()=>setTab(k)}>{l}</button>)}
    </nav>
    {error&&<div className="card" style={{padding:16,marginBottom:16,color:"var(--bad)"}}>Error: {error}</div>}
    {loading?<div style={{color:"var(--muted-fg)"}}>Cargando…</div>:<>
      {tab==="pendientes"&&<Pendientes invoices={inv} onMark={onMark} clientes={clientes} datosCobro={config.datos_cobro}/>}
      {tab==="dashboard"&&<Resumen invoices={inv} costos={costos}/>}
      {tab==="facturas"&&<Facturas invoices={inv} onMark={onMark}/>}
      {tab==="clientes"&&<ClientesView clientes={clientes} invoices={inv} onSave={onSaveCliente} onDelete={onDeleteCliente} datosCobro={config.datos_cobro} onSaveDatos={onSaveDatos}/>}
      {tab==="costos"&&<CostosView costos={costos} onSave={onSaveCosto} onDelete={onDeleteCosto}/>}
      {tab==="importar"&&<Importar onDone={load} total={inv.length}/>}
    </>}
    <footer style={{marginTop:32,textAlign:"center",fontSize:12,color:"var(--muted-fg)"}}>Datos protegidos · solo usuarios autorizados.</footer>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
