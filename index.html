:root{
  --bg:#f6f5f1; --card:#fff; --fg:#1d2430; --muted-fg:#717a89; --muted-bg:#eef0ee;
  --border:#e3e4df; --grid:#ecede8; --accent:#0f5c4a;
  --ok:#0f8a5f; --ok-bg:#e3f5ec; --warn:#b8791b; --warn-bg:#fbf0db; --bad:#c0392b; --bad-bg:#fae7e4;
}
*{box-sizing:border-box;font-family:'IBM Plex Sans',system-ui,sans-serif}
body{margin:0;background:var(--bg);color:var(--fg)}
.font-display{font-family:'Fraunces',Georgia,serif}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px}
.input{width:100%;padding:9px 12px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:14px;outline:none}
.input:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:11px;font-weight:600;font-size:14px;border:none;cursor:pointer}

.tab.on{background:var(--accent);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted-fg);background:var(--muted-bg)}
td{padding:10px 12px;border-top:1px solid var(--border)}
.badge{display:inline-flex;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
select.input{appearance:none}
.modal-bg{position:fixed;inset:0;background:rgba(15,20,30,.55);display:grid;place-items:center;padding:16px;z-index:50}

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

/* ---------- Supabase ---------- */
const CONFIGURED = window.SUPABASE_URL && !window.SUPABASE_URL.includes("TU-PROYECTO") && window.SUPABASE_ANON_KEY && !window.SUPABASE_ANON_KEY.includes("PEGA-AQUI");
const sb = CONFIGURED ? supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY) : null;

/* ---------- constantes / formato ---------- */
const CURRENCIES = ["USD","ARS","UYU"];
const CUR_LABEL = {USD:"Dólares",ARS:"Pesos AR",UYU:"Pesos UY"};
const CUR_SYM = {USD:"US$",ARS:"AR$",UYU:"$U"};
const EST_STYLE = {
  Cobrado:{bg:"var(--ok-bg)",fg:"var(--ok)"}, Pendiente:{bg:"var(--warn-bg)",fg:"var(--warn)"},
  Perdido:{bg:"var(--bad-bg)",fg:"var(--bad)"}, Anulado:{bg:"var(--muted-bg)",fg:"var(--muted-fg)"}, Neteado:{bg:"var(--muted-bg)",fg:"var(--muted-fg)"},
};
const fmtMoney=(n,c)=>{const v=Number(n||0);return `${v<0?"-":""}${CUR_SYM[c]||""} ${Math.abs(v).toLocaleString("es-UY",{minimumFractionDigits:2,maximumFractionDigits:2})}`;};
const monthKey=iso=>iso?String(iso).slice(0,7):"";
const M_ES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const monthLabel=mk=>{if(!mk)return "—";const[y,m]=mk.split("-");return `${M_ES[+m-1]} ${y.slice(2)}`;};
const todayISO=()=>new Date().toISOString().slice(0,10);

/* ---------- normalización + parse del Excel ---------- */
const _num=v=>{const n=Number(v);return isNaN(n)?0:Math.round(n*100)/100;};
const _str=v=>v==null?"":String(v).trim();
function _toISO(v){
  if(v==null||v==="")return null;
  if(v instanceof Date)return new Date(v.getTime()-v.getTimezoneOffset()*60000).toISOString().slice(0,10);
  if(typeof v==="number"){const d=new Date(Math.round((v-25569)*86400*1000));return d.toISOString().slice(0,10);}
  const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);if(m){let[,d,mo,y]=m;if(y.length===2)y="20"+y;return `${y}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}`;}
  return null;
}
const _serv=s=>{s=_str(s).toLowerCase();if(!s)return "Otro";if(s.includes("shop"))return "TuShopper";if(s.includes("fud"))return "TuFud";if(s.includes("deri"))return "Deri";return s.charAt(0).toUpperCase()+s.slice(1);};
const _mon=s=>{s=_str(s).toUpperCase();if(s.includes("DOLAR"))return "USD";if(s.includes("ARGENT"))return "ARS";if(s.includes("URUGUAY"))return "UYU";return CURRENCIES.includes(s)?s:"USD";};
const _est=s=>{s=_str(s).toUpperCase();if(s==="PAGO")return "Cobrado";if(s.includes("PENDIENTE"))return "Pendiente";if(s.includes("PERDID")||s.includes("INCOBRAB"))return "Perdido";if(s.includes("ANULAD"))return "Anulado";if(s.includes("NETE")||s.includes("CANCEL"))return "Neteado";return "Pendiente";};
const _medio=s=>{const m={santander:"Santander",itau:"Itau",blex:"Blex",dlocal:"Dlocal",cheque:"Cheque",koywe:"Koywe",anulada:""};const l=_str(s).toLowerCase();return l?(m[l]||_str(s).charAt(0).toUpperCase()+_str(s).slice(1)):"";};
const clave=i=>`${_str(i.cliente).toLowerCase()}|${_str(i.numeracion).toLowerCase()}|${i.mes||""}|${i.total}|${i.moneda}`;

function parseWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array",cellDates:true});
  const name=wb.SheetNames.find(n=>/omnilog/i.test(n))||wb.SheetNames.find(n=>/factur/i.test(n));
  if(!name)throw new Error("No encontré una hoja FACTURACION_OMNILOG en el archivo.");
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
  const out=[];
  for(let r=1;r<rows.length;r++){
    const row=rows[r];if(!row)continue;const cli=row[0];if(!cli||!String(cli).trim())continue;
    let com=_str(row[23]);if(com.toLowerCase()==="s/c")com="";com=com.slice(0,90);
    const o={cliente:_str(cli),comprobante:_str(row[1]),numeracion:_str(row[2]),servicio:_serv(row[3]),moneda:_mon(row[4]),
      importe:_num(row[5]),iva:_num(row[6]),total:_num(row[7]),fecha_emision:_toISO(row[11]),mes:_toISO(row[12]),
      fecha_vencimiento:_toISO(row[14]),estado:_est(row[15]),medio_pago:_medio(row[16]),fecha_pago:_toISO(row[20]),
      referencia:_str(row[21]).slice(0,40),comentarios:com};
    o.clave=clave(o);out.push(o);
  }
  if(!out.length)throw new Error("La hoja no tiene filas con cliente.");
  return out;
}

/* ---------- acceso a datos ---------- */
async function fetchAll(){
  let all=[],from=0;
  while(true){
    const {data,error}=await sb.from("facturas").select("*").order("mes",{ascending:false}).range(from,from+999);
    if(error)throw error;all=all.concat(data);if(data.length<1000)break;from+=1000;
  }
  return all;
}
async function fetchClaves(){
  let all=[],from=0;
  while(true){
    const {data,error}=await sb.from("facturas").select("id,clave,estado").range(from,from+999);
    if(error)throw error;all=all.concat(data);if(data.length<1000)break;from+=1000;
  }
  return all;
}
async function importRows(rows){
  const existing=await fetchClaves();
  const map=new Map(existing.map(r=>[r.clave,r]));
  const nuevas=[],updates=[];
  for(const r of rows){
    const e=map.get(r.clave);
    if(!e)nuevas.push(r);
    else if(e.estado==="Pendiente"&&r.estado!=="Pendiente")updates.push({id:e.id,estado:r.estado,medio_pago:r.medio_pago,fecha_pago:r.fecha_pago});
  }
  for(let i=0;i<nuevas.length;i+=400){
    const {error}=await sb.from("facturas").upsert(nuevas.slice(i,i+400),{onConflict:"clave",ignoreDuplicates:true});
    if(error)throw error;
  }
  for(const u of updates){
    const {error}=await sb.from("facturas").update({estado:u.estado,medio_pago:u.medio_pago,fecha_pago:u.fecha_pago}).eq("id",u.id);
    if(error)throw error;
  }
  return {nuevas:nuevas.length,actualizadas:updates.length};
}
async function updateInvoice(id,patch){const {error}=await sb.from("facturas").update(patch).eq("id",id);if(error)throw error;}

/* ---------- UI básica ---------- */
function Badge({estado}){const s=EST_STYLE[estado]||EST_STYLE.Pendiente;return <span className="badge" style={{background:s.bg,color:s.fg}}>{estado}</span>;}

function CobrarModal({inv,onClose,onConfirm}){
  const [fecha,setFecha]=useState(todayISO());
  const [medio,setMedio]=useState(inv.medio_pago||"Santander");
  const [ref,setRef]=useState(inv.referencia||"");
  return <div className="modal-bg" onClick={onClose}>
    <div className="card" style={{padding:24,width:"100%",maxWidth:420}} onClick={e=>e.stopPropagation()}>
      <h3 className="font-display" style={{margin:"0 0 4px",fontSize:20}}>Marcar como cobrada</h3>
      <p style={{color:"var(--muted-fg)",fontSize:14,marginTop:0}}>{inv.cliente} · {inv.numeracion} · <span className="num">{fmtMoney(inv.total,inv.moneda)}</span></p>
      <label style={{fontSize:12,fontWeight:600,color:"var(--muted-fg)"}}>Fecha de pago</label>
      <input type="date" className="input" value={fecha} onChange={e=>setFecha(e.target.value)} style={{margin:"4px 0 12px"}}/>
      <label style={{fontSize:12,fontWeight:600,color:"var(--muted-fg)"}}>Medio de pago</label>
      <select className="input" value={medio} onChange={e=>setMedio(e.target.value)} style={{margin:"4px 0 12px"}}>
        {["Santander","Itau","Blex","Dlocal","Cheque","Koywe","Transferencia","Otro"].map(m=><option key={m}>{m}</option>)}
      </select>
      <label style={{fontSize:12,fontWeight:600,color:"var(--muted-fg)"}}>Referencia (opcional)</label>
      <input className="input" value={ref} onChange={e=>setRef(e.target.value)} style={{margin:"4px 0 18px"}} placeholder="Nº de transferencia, recibo…"/>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" onClick={()=>onConfirm({fecha_pago:fecha,medio_pago:medio,referencia:ref})}>✓ Confirmar</button>
      </div>
    </div>
  </div>;
}

/* ---------- Pendientes ---------- */
function Pendientes({invoices,onMark}){
  const [groupBy,setGroupBy]=useState("cliente");
  const [cur,setCur]=useState("Todas");
  const [q,setQ]=useState("");
  const [soloVenc,setSoloVenc]=useState(false);
  const [open,setOpen]=useState({});
  const [cobrar,setCobrar]=useState(null);
  const hoy=todayISO();
  const pend=useMemo(()=>{const qq=q.trim().toLowerCase();return invoices.filter(i=>i.estado==="Pendiente"
    &&(cur==="Todas"||i.moneda===cur)
    &&(!soloVenc||(i.fecha_vencimiento&&i.fecha_vencimiento<hoy))
    &&(!qq||`${i.cliente} ${i.numeracion} ${i.referencia}`.toLowerCase().includes(qq)));},[invoices,cur,q,soloVenc]);
  const totals=t=>CURRENCIES.filter(c=>t[c]).map(c=>fmtMoney(t[c],c)).join("  ·  ")||"—";
  const groups=useMemo(()=>{const m={};pend.forEach(i=>{const k=groupBy==="cliente"?i.cliente:monthKey(i.mes||i.fecha_emision);
    m[k]=m[k]||{key:k,items:[],totals:{},venc:0};m[k].items.push(i);
    if(i.fecha_vencimiento&&i.fecha_vencimiento<hoy)m[k].venc++;
    m[k].totals[i.moneda]=(m[k].totals[i.moneda]||0)+i.total;});
    const a=Object.values(m);a.forEach(g=>g.items.sort((x,y)=>(y.mes||"").localeCompare(x.mes||"")));
    if(groupBy==="mes")a.sort((x,y)=>y.key.localeCompare(x.key));
    else a.sort((x,y)=>Object.values(y.totals).reduce((s,v)=>s+Math.abs(v),0)-Object.values(x.totals).reduce((s,v)=>s+Math.abs(v),0));
    return a;},[pend,groupBy]);
  const grand=useMemo(()=>{const t={};pend.forEach(i=>t[i.moneda]=(t[i.moneda]||0)+i.total);return t;},[pend]);

  return <div>
    <div className="card" style={{padding:16,marginBottom:16}}>
      <div style={{display:"flex",flexWrap:"wrap",gap:12,alignItems:"center"}}>
        <span style={{fontSize:14,fontWeight:600,color:"var(--muted-fg)"}}>Agrupar por:</span>
        <div style={{display:"flex",background:"var(--muted-bg)",borderRadius:11,padding:4}}>
          {[["cliente","Cliente"],["mes","Mes"]].map(([k,l])=>
            <button key={k} onClick={()=>{setGroupBy(k);setOpen({});}} className="tab" style={groupBy===k?{background:"var(--card)",color:"var(--fg)"}:{}}>{l}</button>)}
        </div>
        <select className="input" style={{width:"auto"}} value={cur} onChange={e=>setCur(e.target.value)}>
          {["Todas",...CURRENCIES].map(o=><option key={o}>{o}</option>)}
        </select>
        <button className="btn" onClick={()=>setSoloVenc(v=>!v)} style={soloVenc?{background:"var(--bad-bg)",color:"var(--bad)",border:"1px solid var(--bad)"}:{background:"var(--card)",color:"var(--muted-fg)",border:"1px solid var(--border)"}}>{soloVenc?"● Solo vencidas":"Solo vencidas"}</button>
        <input className="input" style={{flex:1,minWidth:180}} value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar cliente o factura…"/>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:"4px 22px",marginTop:12,fontSize:14,color:"var(--muted-fg)"}}>
        <span><b style={{color:"var(--fg)"}}>{pend.length}</b> por cobrar</span>
        <span><b style={{color:"var(--fg)"}}>{groups.length}</b> {groupBy==="cliente"?"clientes":"meses"}</span>
        {CURRENCIES.filter(c=>grand[c]).map(c=><span key={c}>{CUR_LABEL[c]}: <b className="num" style={{color:"var(--warn)"}}>{fmtMoney(grand[c],c)}</b></span>)}
      </div>
    </div>
    {groups.length===0&&<div className="card" style={{padding:40,textAlign:"center",color:"var(--muted-fg)"}}>No hay pendientes con estos filtros. ¡Todo cobrado!</div>}
    {groups.map(g=>{const o=open[g.key];return <div key={g.key} className="card" style={{marginBottom:12,overflow:"hidden"}}>
      <button onClick={()=>setOpen(s=>({...s,[g.key]:!s[g.key]}))} style={{width:"100%",display:"flex",alignItems:"center",gap:12,padding:"12px 16px",background:"none",border:"none",cursor:"pointer",textAlign:"left"}}>
        <span style={{color:"var(--muted-fg)",transform:o?"rotate(90deg)":"none"}}>▸</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:600}}>{groupBy==="cliente"?g.key:monthLabel(g.key)}</div>
          <div style={{fontSize:12,color:"var(--muted-fg)",display:"flex",gap:8}}>
            <span>{g.items.length} factura{g.items.length!==1?"s":""}</span>
            {g.venc>0&&<span className="badge" style={{background:"var(--bad-bg)",color:"var(--bad)"}}>{g.venc} vencida{g.venc!==1?"s":""}</span>}
          </div>
        </div>
        <div className="num" style={{fontWeight:600,color:"var(--warn)",fontSize:14}}>{totals(g.totals)}</div>
      </button>
      {o&&<div style={{borderTop:"1px solid var(--border)",overflowX:"auto"}}><table><tbody>
        {g.items.map(i=><tr key={i.id}>
          <td style={{fontWeight:600,whiteSpace:"nowrap"}}>{i.numeracion}</td>
          <td style={{color:"var(--muted-fg)"}}>{groupBy==="cliente"?monthLabel(monthKey(i.mes||i.fecha_emision)):i.cliente}</td>
          <td style={{color:"var(--muted-fg)"}}>{i.servicio}</td>
          <td className="num" style={{fontWeight:600,whiteSpace:"nowrap"}}>{fmtMoney(i.total,i.moneda)}</td>
          <td style={{fontSize:12,whiteSpace:"nowrap",color:i.fecha_vencimiento&&i.fecha_vencimiento<hoy?"var(--bad)":"var(--muted-fg)"}}>
            {!i.fecha_vencimiento?"—":i.fecha_vencimiento<hoy?`vencida hace ${Math.round((Date.parse(hoy)-Date.parse(i.fecha_vencimiento))/86400000)} d`:`vence ${i.fecha_vencimiento}`}</td>
          <td style={{textAlign:"right",whiteSpace:"nowrap"}}>
            <button className="btn btn-primary" style={{padding:"6px 11px"}} onClick={()=>setCobrar(i)}>✓ Cobrada</button>
            <button className="btn btn-ghost" style={{padding:"6px 9px",marginLeft:4,color:"var(--bad)"}} title="Perdida" onClick={()=>{if(confirm("¿Marcar como perdida (incobrable)?"))onMark(i.id,{estado:"Perdido"});}}>⚠</button>
          </td>
        </tr>)}
      </tbody></table></div>}
    </div>;})}
    {cobrar&&<CobrarModal inv={cobrar} onClose={()=>setCobrar(null)} onConfirm={d=>{onMark(cobrar.id,{estado:"Cobrado",...d});setCobrar(null);}}/>}
  </div>;
}

/* ---------- Resumen ---------- */
function Resumen({invoices}){
  const t=useMemo(()=>{const o={};CURRENCIES.forEach(c=>o[c]={Cobrado:0,Pendiente:0,Perdido:0});
    invoices.forEach(i=>{if(o[i.moneda]&&o[i.moneda][i.estado]!=null)o[i.moneda][i.estado]+=i.total;});return o;},[invoices]);
  const Kpi=({label,key2,color})=><div className="card" style={{padding:20}}>
    <div style={{fontWeight:600,marginBottom:10,color}}>{label}</div>
    {CURRENCIES.map(c=><div key={c} style={{display:"flex",justifyContent:"space-between",margin:"6px 0"}}>
      <span style={{fontSize:13,color:"var(--muted-fg)"}}>{CUR_LABEL[c]}</span>
      <span className="num" style={{fontWeight:700,fontSize:17}}>{fmtMoney(t[c][key2],c)}</span></div>)}
  </div>;
  return <div style={{display:"grid",gap:16,gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))"}}>
    <Kpi label="Cobrado" key2="Cobrado" color="var(--ok)"/>
    <Kpi label="Por cobrar" key2="Pendiente" color="var(--warn)"/>
    <Kpi label="Perdido" key2="Perdido" color="var(--bad)"/>
  </div>;
}

/* ---------- Facturas ---------- */
function Facturas({invoices,onMark}){
  const [q,setQ]=useState("");const [est,setEst]=useState("Todos");const [mon,setMon]=useState("Todas");
  const list=useMemo(()=>{const qq=q.trim().toLowerCase();return invoices.filter(i=>
    (est==="Todos"||i.estado===est)&&(mon==="Todas"||i.moneda===mon)
    &&(!qq||`${i.cliente} ${i.numeracion}`.toLowerCase().includes(qq))).slice(0,300);},[invoices,q,est,mon]);
  return <div>
    <div className="card" style={{padding:16,marginBottom:16,display:"flex",gap:12,flexWrap:"wrap"}}>
      <input className="input" style={{flex:1,minWidth:180}} value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar…"/>
      <select className="input" style={{width:"auto"}} value={est} onChange={e=>setEst(e.target.value)}>{["Todos","Pendiente","Cobrado","Perdido","Anulado","Neteado"].map(o=><option key={o}>{o}</option>)}</select>
      <select className="input" style={{width:"auto"}} value={mon} onChange={e=>setMon(e.target.value)}>{["Todas",...CURRENCIES].map(o=><option key={o}>{o}</option>)}</select>
    </div>
    <div className="card" style={{overflow:"hidden"}}><div style={{overflowX:"auto"}}><table>
      <thead><tr>{["Cliente","Factura","Servicio","Mes","Total","Estado",""].map(h=><th key={h}>{h}</th>)}</tr></thead>
      <tbody>{list.map(i=><tr key={i.id}>
        <td style={{fontWeight:500}}>{i.cliente}</td><td style={{whiteSpace:"nowrap",color:"var(--muted-fg)"}}>{i.numeracion}</td>
        <td style={{color:"var(--muted-fg)"}}>{i.servicio}</td><td style={{whiteSpace:"nowrap",color:"var(--muted-fg)"}}>{monthLabel(monthKey(i.mes||i.fecha_emision))}</td>
        <td className="num" style={{fontWeight:600,whiteSpace:"nowrap"}}>{fmtMoney(i.total,i.moneda)}</td><td><Badge estado={i.estado}/></td>
        <td style={{textAlign:"right"}}>{i.estado!=="Cobrado"&&<button className="btn btn-ghost" style={{padding:"5px 9px",color:"var(--ok)"}} title="Marcar cobrada" onClick={()=>onMark(i.id,{estado:"Cobrado",fecha_pago:todayISO()})}>✓</button>}</td>
      </tr>)}</tbody>
    </table></div></div>
  </div>;
}

/* ---------- Importar ---------- */
function Importar({onDone,total}){
  const [busy,setBusy]=useState(false);const [msg,setMsg]=useState("");const [err,setErr]=useState("");
  const onFile=async e=>{const f=e.target.files?.[0];if(!f)return;setErr("");setMsg("");setBusy(true);
    try{const rows=parseWorkbook(await f.arrayBuffer());setMsg(`Procesando ${rows.length} filas…`);
      const res=await importRows(rows);await onDone();
      setMsg(`Listo: ${res.nuevas} factura(s) nueva(s) registrada(s) y ${res.actualizadas} marcada(s) como cobrada(s) desde el Excel. El resto quedó igual.`);}
    catch(ex){setErr(ex.message||String(ex));}setBusy(false);e.target.value="";};
  return <div className="card" style={{padding:24,maxWidth:620}}>
    <h3 className="font-display" style={{fontSize:20,margin:"0 0 4px"}}>Subir el Excel del mes</h3>
    <p style={{color:"var(--muted-fg)",fontSize:14}}>Leo la hoja <b>FACTURACION_OMNILOG</b>, agrego las facturas nuevas y, si en el Excel marcaste como pagada una que estaba pendiente, la paso a cobrada. Lo que ya marcaste como cobrado en la web no se pisa.</p>
    <label className="btn btn-primary" style={{cursor:"pointer"}}>📄 Elegir archivo .xlsx<input type="file" accept=".xlsx,.xls" onChange={onFile} style={{display:"none"}}/></label>
    {busy&&<span style={{marginLeft:10,color:"var(--muted-fg)"}}>Trabajando…</span>}
    {msg&&<div style={{marginTop:16,padding:12,borderRadius:11,background:"var(--ok-bg)",color:"var(--ok)",fontSize:14}}>{msg}</div>}
    {err&&<div style={{marginTop:16,padding:12,borderRadius:11,background:"var(--bad-bg)",color:"var(--bad)",fontSize:14}}>{err}</div>}
    <p style={{marginTop:18,fontSize:13,color:"var(--muted-fg)"}}>En la base hay <b style={{color:"var(--fg)"}}>{total}</b> facturas.</p>
  </div>;
}

/* ---------- Login ---------- */
function Login(){
  const [email,setEmail]=useState("");const [pass,setPass]=useState("");
  const [err,setErr]=useState("");const [busy,setBusy]=useState(false);
  const submit=async()=>{
    if(!email.trim()||!pass)return;
    setErr("");setBusy(true);
    const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:pass});
    if(error)setErr("Email o contraseña incorrectos.");
    setBusy(false);
  };
  const onKey=e=>{if(e.key==="Enter")submit();};
  return <div className="wrap" style={{maxWidth:400,paddingTop:64}}>
    <div style={{textAlign:"center",marginBottom:20}}>
      <span style={{display:"inline-grid",placeItems:"center",width:52,height:52,borderRadius:16,background:"var(--accent)",color:"#fff",fontSize:26}}>$</span>
      <h1 className="font-display" style={{margin:"12px 0 0",fontSize:26}}>Cobros Omnilog</h1>
      <p style={{color:"var(--muted-fg)",fontSize:14,marginTop:4}}>Ingresá para ver la cobranza</p>
    </div>
    <div className="card" style={{padding:24}}>
      <label style={{fontSize:12,fontWeight:600,color:"var(--muted-fg)"}}>Email</label>
      <input className="input" type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={onKey} style={{margin:"4px 0 12px"}} placeholder="tu@email.com"/>
      <label style={{fontSize:12,fontWeight:600,color:"var(--muted-fg)"}}>Contraseña</label>
      <input className="input" type="password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={onKey} style={{margin:"4px 0 18px"}} placeholder="••••••••"/>
      {err&&<div style={{marginBottom:12,padding:10,borderRadius:10,background:"var(--bad-bg)",color:"var(--bad)",fontSize:13}}>{err}</div>}
      <button className="btn btn-primary" style={{width:"100%",justifyContent:"center"}} onClick={submit} disabled={busy}>{busy?"Ingresando…":"Ingresar"}</button>
    </div>
  </div>;
}

/* ---------- App ---------- */
function App(){
  const [session,setSession]=useState(undefined); // undefined = verificando
  const [inv,setInv]=useState([]);const [loading,setLoading]=useState(true);const [tab,setTab]=useState("pendientes");const [error,setError]=useState("");
  const load=useCallback(async()=>{setLoading(true);try{setInv(await fetchAll());setError("");}catch(e){setError(e.message||String(e));}setLoading(false);},[]);

  useEffect(()=>{
    if(!CONFIGURED){setSession(null);return;}
    sb.auth.getSession().then(({data})=>setSession(data.session));
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  useEffect(()=>{if(session)load();},[session]);

  const onMark=async(id,patch)=>{await updateInvoice(id,patch);setInv(prev=>prev.map(i=>i.id===id?{...i,...patch}:i));};
  const logout=async()=>{await sb.auth.signOut();setInv([]);};

  if(!CONFIGURED)return <div className="wrap"><div className="card" style={{padding:28}}>
    <h2 className="font-display">Falta configurar Supabase</h2>
    <p style={{color:"var(--muted-fg)"}}>Abrí este archivo con un editor de texto y pegá tu <b>Project URL</b> y tu <b>anon public key</b> en las dos líneas de arriba (bloque PASO 1). Después volvé a subirlo.</p>
  </div></div>;

  if(session===undefined)return <div className="wrap" style={{paddingTop:80,textAlign:"center",color:"var(--muted-fg)"}}>Cargando…</div>;
  if(!session)return <Login/>;

  const TABS=[["pendientes","Pendientes"],["dashboard","Resumen"],["facturas","Facturas"],["importar","Importar"]];
  return <div className="wrap">
    <header style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
      <span style={{display:"grid",placeItems:"center",width:44,height:44,borderRadius:14,background:"var(--accent)",color:"#fff",fontSize:22}}>$</span>
      <div style={{flex:1}}><h1 className="font-display" style={{margin:0,fontSize:24}}>Cobros Omnilog</h1>
      <div style={{fontSize:12,color:"var(--muted-fg)"}}>{inv.length} facturas en la base</div></div>
      <div style={{textAlign:"right"}}>
        <div style={{fontSize:12,color:"var(--muted-fg)"}}>{session.user?.email}</div>
        <button onClick={logout} style={{background:"none",border:"none",color:"var(--accent)",fontWeight:600,fontSize:13,cursor:"pointer",padding:0}}>Cerrar sesión</button>
      </div>
    </header>
    <nav className="card" style={{display:"inline-flex",gap:4,padding:4,marginBottom:20}}>
      {TABS.map(([k,l])=><button key={k} className={"tab"+(tab===k?" on":"")} onClick={()=>setTab(k)}>{l}</button>)}
    </nav>
    {error&&<div className="card" style={{padding:16,marginBottom:16,color:"var(--bad)"}}>Error: {error}</div>}
    {loading?<div style={{color:"var(--muted-fg)"}}>Cargando…</div>:<>
      {tab==="pendientes"&&<Pendientes invoices={inv} onMark={onMark}/>}
      {tab==="dashboard"&&<Resumen invoices={inv}/>}
      {tab==="facturas"&&<Facturas invoices={inv} onMark={onMark}/>}
      {tab==="importar"&&<Importar onDone={load} total={inv.length}/>}
    </>}
    <footer style={{marginTop:32,textAlign:"center",fontSize:12,color:"var(--muted-fg)"}}>Datos protegidos · solo usuarios autorizados.</footer>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
